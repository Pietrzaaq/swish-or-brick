[project]
name = "brickorswish"
version = "0.1.0"
description = "Reference implementation of BrickOrSwish shot logic (standard library only)."
requires-python = ">=3.12"
license = "MIT"
# Intentionally empty: brickorswish.logic, .eval and .tools must stay standard-library only
# so they can run on any machine without third-party code. brickorswish.detect needs the
# optional `detect` group and runs only in the cloud (ml/notebooks/detect_video.ipynb on Colab).
dependencies = []

[project.optional-dependencies]
detect = ["rfdetr==1.12.1", "opencv-python>=4.8"]

[build-system]
requires = ["setuptools>=77"]  # SPDX string in `license`
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brickorswish*"]
