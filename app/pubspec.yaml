publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  camera: ^0.12.2
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  shot_logic:
    path: packages/shot_logic

dev_dependencies:
